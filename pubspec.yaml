name: receiptvault_flutter
description: ReceiptVault - personal purchase and warranty manager.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+1

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  flutter_staggered_animations: ^1.1.1
  firebase_core: ^3.10.0
  cloud_firestore: ^5.6.1
  firebase_auth: ^5.4.1
  firebase_storage: ^12.3.6
  cloud_functions: ^5.2.0
  google_fonts: ^8.1.0
  google_mlkit_text_recognition: ^0.13.0
  image: ^4.3.0
  image_picker: ^1.1.2
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  http: ^1.6.0
  hugeicons: ^1.1.7
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/android/app_icon.png"
  adaptive_icon_background: "#121318"
  adaptive_icon_foreground: "assets/icons/android/ic_foreground.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/safe_scanner.png
    - assets/images/Home_12.png
    - assets/images/Icons/
